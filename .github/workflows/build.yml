name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build APK
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "${SIGNING_KEYSTORE_BASE64}" && -n "${SIGNING_STORE_PASSWORD}" && -n "${SIGNING_KEY_ALIAS}" && -n "${SIGNING_KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/onda-release.jks"
            printf '%s' "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            chmod 600 "${KEYSTORE_PATH}"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "store_file=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "Signing secrets unavailable on pull request; building unsigned release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing required signing secrets (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD)."
            exit 1
          fi

      - name: Build release APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify and prepare APK and AAB outputs
        id: apk
        run: |
          mkdir -p dist
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
            RAW_AAB="app/build/outputs/bundle/release/app-release.aab"
            test -f "${RAW_APK}"
            test -f "${RAW_AAB}"
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n1)"
            if [[ -n "${APKSIGNER}" ]]; then
              "${APKSIGNER}" verify --print-certs "${RAW_APK}"
            else
              jarsigner -verify "${RAW_APK}"
            fi
            jarsigner -verify "${RAW_AAB}"
            SUFFIX=""
          else
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            RAW_AAB="app/build/outputs/bundle/release/app-release.aab"
            test -f "${RAW_APK}"
            test -f "${RAW_AAB}"
            SUFFIX="-unsigned"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BASE_NAME="onda-${GITHUB_REF_NAME}${SUFFIX}"
          else
            VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)"
            SHORT_SHA="${GITHUB_SHA::7}"
            if [[ -n "${VERSION_NAME}" ]]; then
              BASE_NAME="onda-v${VERSION_NAME}-${SHORT_SHA}${SUFFIX}"
            else
              BASE_NAME="onda-${SHORT_SHA}${SUFFIX}"
            fi
          fi

          APK_NAME="${BASE_NAME}.apk"
          AAB_NAME="${BASE_NAME}.aab"
          cp "${RAW_APK}" "dist/${APK_NAME}"
          cp "${RAW_AAB}" "dist/${AAB_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_path=dist/${AAB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/onda-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onda-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload AAB artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: onda-aab
          path: ${{ steps.apk.outputs.aab_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload R8 mapping artifact (Google Play crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: onda-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH="${{ steps.apk.outputs.path }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_PATH}" --clobber
          else
            gh release create "${TAG}" "${APK_PATH}" \
              --title "Onda ${TAG}" \
              --generate-notes
          fi
